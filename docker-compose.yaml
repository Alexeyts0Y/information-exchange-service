services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-threat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-threat}
      POSTGRES_DB: ${DB_NAME:-threats}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-threat}
      DB_PASSWORD: ${DB_PASSWORD:-threat}
      DB_NAME: ${DB_NAME:-threats}
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: app
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-threat}
      DB_PASSWORD: ${DB_PASSWORD:-threat}
      DB_NAME: ${DB_NAME:-threats}
      DB_SSLMODE: disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata: