    ThreatSource:
      type: object
      description: Источник данных об угрозе
      properties:
        name:
          type: string
          example: "Internal Sandbox"
        type:
          type: string
          description: Тип источника (закрытое множество)
          enum: [sandbox, vendor, researcher, internal, feed, other]
          example: "sandbox"
        url:
          type: string
          format: uri
          example: "https://example.com/sandbox"

    Detection:
      type: object
      description: Детект антивирусного движка
      properties:
        engine:
          type: string
          example: "Kaspersky"
        version:
          type: string
          example: "21.3.10.391"
        signature:
          type: string
          example: "Trojan.Win32.Generic"

    NetworkIOC:
      type: object
      description: Сетевой индикатор компрометации
      properties:
        type:
          type: string
          description: Тип сетевого IOC (закрытое множество)
          enum: [ip, domain, url]
          example: "domain"
        value:
          type: string
          example: "evil.example.com"
        description:
          type: string
          example: "C2-домен"

    FileIOC:
      type: object
      description: Файловый индикатор компрометации
      properties:
        type:
          type: string
          description: Тип файлового IOC (закрытое множество)
          enum: [path, registry, filename]
          example: "path"
        value:
          type: string
          example: "C:\\Windows\\Temp\\update.exe"
        description:
          type: string
          example: "Путь доставки"

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Человекочитаемое описание ошибки
          example: "Threat not found"
        details:
          type: string